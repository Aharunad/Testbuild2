name: Build ATLAS Android APK

'on':
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-atlas-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ATLAS_Futurica_v0.2_Source.zip"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "ERROR: V2 source ZIP not found in repository root."
            echo "Files found:"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -printf '%h\n' -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo "The ZIP may not contain a complete Android Gradle project."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Futurica-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
