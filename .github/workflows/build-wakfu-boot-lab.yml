name: WAKFU Android Compatibility Probe APK
on:
  push:
    branches:
      - 'wakfu-android-lab-*'
    paths:
      - 'wakfu-android-lab/**'
      - '.github/workflows/build-wakfu-boot-lab.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug APK
        working-directory: wakfu-android-lab
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WAKFU-Android-Compatibility-Probe-0.1-APK
          path: wakfu-android-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
